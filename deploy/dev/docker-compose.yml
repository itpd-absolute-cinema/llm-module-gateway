services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  plugin-manager:
    image: itpd/plugin-manager:latest
    environment:
      PLUGINS_DIR: /data/plugins
    volumes:
      - plugins:/data/plugins:ro

  gateway:
    image: itpd/llm-gateway:latest
    depends_on:
      - mongo
      - plugin-manager
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:?set GATEWAY_ADMIN_API_KEY}
      GATEWAY_PLUGINS_DIR: /data/plugins
      MONGODB_URI: mongodb://mongo:27017/gateway
      PLUGIN_MANAGER_URL: http://plugin-manager:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
    volumes:
      - plugins:/data/plugins

volumes:
  mongo-data:
  plugins: