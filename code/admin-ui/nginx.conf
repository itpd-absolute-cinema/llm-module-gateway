server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go through the same origin, so CORS is not needed
  location /api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 20m;
  }
  # the plugin guide is a plain file: always serve the latest version
  location = /PLUGINS.md { add_header Cache-Control "no-store"; }
  location / { try_files $uri /index.html; }
}
