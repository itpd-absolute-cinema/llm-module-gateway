server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go through the same origin, so CORS is not needed
  location /api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 20m;
  }
  # the plugin guide is a plain file: always serve the latest version
  location = /PLUGINS.md { add_header Cache-Control "no-store"; }
  # runtime configuration is generated at container start: the browser must never cache it
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    expires -1;
  }
  # index.html references the hashed bundles, so it must always be revalidated
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / { try_files $uri /index.html; }
}
