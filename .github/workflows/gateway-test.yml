name: Gateway tests

on:
  push:
    branches: [main]
    paths:
      - 'code/service-gateway/**'
      - '.github/workflows/gateway-test.yml'
  pull_request:
    paths:
      - 'code/service-gateway/**'
      - '.github/workflows/gateway-test.yml'

# a new push to the same ref cancels the previous run
concurrency:
  group: gateway-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# applies to every `run` step; `uses` steps need their own paths
defaults:
  run:
    working-directory: code/service-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: code/service-gateway

      # separates runner/Docker problems from test problems; can be removed once the tests are green
      - name: Docker diagnostics
        run: |
          docker version
          docker info
          docker pull mongo:8

      - name: Build and run tests
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            code/service-gateway/app/build/reports/cucumber/
            code/service-gateway/app/build/reports/tests/
            code/service-gateway/app/build/test-results/

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: code/service-gateway

      - name: Build the container image
        run: ./gradlew dockerBuild