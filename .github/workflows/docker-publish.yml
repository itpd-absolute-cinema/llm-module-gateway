name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - week5-artem

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-gateway
            dockerfile: code/service-gateway/app/Dockerfile
            context: code/service-gateway/app

          - name: plugin-manager
            dockerfile: code/plugin-manager/Dockerfile
            context: code/plugin-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Build service-gateway JAR using Gradle
      - name: Set up Java
        if: matrix.name == 'service-gateway'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: matrix.name == 'service-gateway'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build service-gateway JAR
        if: matrix.name == 'service-gateway'
        working-directory: code/service-gateway
        run: |
          chmod +x gradlew
          ./gradlew :app:clean :app:build

      - name: Verify gateway JAR
        if: matrix.name == 'service-gateway'
        run: |
          ls -lah code/service-gateway/app/build/libs/
          test -f code/service-gateway/app/build/libs/gateway.jar

      # Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image metadata and tags
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build and publish
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
