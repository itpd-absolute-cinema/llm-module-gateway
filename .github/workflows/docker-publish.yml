name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - week5-artem

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-gateway
            dockerfile: code/service-gateway/app/Dockerfile
            context: code/service-gateway/app

          - name: plugin-manager
            dockerfile: code/plugin-manager/Dockerfile
            context: code/plugin-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build service-gateway JAR using Gradle
      - name: Set up Java
        if: matrix.name == 'service-gateway'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: matrix.name == 'service-gateway'
        uses: gradle/actions/setup-gradle@v4

      - name: Build service-gateway JAR
        if: matrix.name == 'service-gateway'
        working-directory: code/service-gateway
        run: |
          chmod +x gradlew
          ./gradlew :app:clean :app:build

      - name: Verify gateway JAR
        if: matrix.name == 'service-gateway'
        run: |
          ls -lah code/service-gateway/app/build/libs/
          test -f code/service-gateway/app/build/libs/gateway.jar

      # Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image metadata and tags
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build and publish
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}