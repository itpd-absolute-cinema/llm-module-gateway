name: Task
description: A unit of work
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: "- [ ] AC-01: "
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Story
      description: "One story line: — #42 or — #42 (AC-01, AC-02). Leave blank if the task is not related to a story."
    validations:
      required: false